name: Winlator DXVK + SnapFrame integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "dxvk/**"
      - "framegen/**"
      - ".github/workflows/winlator-dxvk.yml"
  push:
    paths:
      - "src/**"
      - "include/**"
      - "dxvk/**"
      - "framegen/**"
      - ".github/workflows/winlator-dxvk.yml"
permissions:
  contents: read
jobs:
  dxvk-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build SnapFrame portable Android library
        run: |
          cmake -S . -B build-snapframe-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DSNAP_AI_BUILD_TESTS=OFF -DSNAP_AI_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_TESTS=OFF -DSNAP_FRAME_BUILD_EXAMPLE=OFF
          cmake --build build-snapframe-android --parallel
