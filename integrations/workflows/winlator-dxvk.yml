name: Winlator DXVK + SnapFrame integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "dxvk/**"
      - "framegen/**"
      - ".github/workflows/winlator-dxvk.yml"
  push:
    paths:
      - "src/**"
      - "include/**"
      - "dxvk/**"
      - "framegen/**"
      - ".github/workflows/winlator-dxvk.yml"
permissions:
  contents: read
jobs:
  dxvk-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate preinstalled Android NDK
        id: ndk
        shell: bash
        run: |
          test -d "$ANDROID_HOME/ndk"
          NDK_HOME="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -f "$NDK_HOME/build/cmake/android.toolchain.cmake"
          echo "toolchain=$NDK_HOME/build/cmake/android.toolchain.cmake" >> "$GITHUB_OUTPUT"
      - name: Build SnapFrame portable Android library
        run: |
          cmake -S . -B build-snapframe-android \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.toolchain }}" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DSNAP_AI_BUILD_TESTS=OFF -DSNAP_AI_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_TESTS=OFF -DSNAP_FRAME_BUILD_EXAMPLE=OFF
          cmake --build build-snapframe-android --parallel
