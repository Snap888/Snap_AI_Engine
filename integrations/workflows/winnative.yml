name: WinNative + SnapFrame integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "framegen/**"
      - "CMakeLists.txt"
      - ".github/workflows/winnative.yml"
  push:
    paths:
      - "src/**"
      - "include/**"
      - "framegen/**"
      - "CMakeLists.txt"
      - ".github/workflows/winnative.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -A x64 -DSNAP_AI_BUILD_TESTS=ON -DSNAP_FRAME_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Note
        run: echo "This validates the portable engine. Add the WinNative compositor adapter target before treating this as a full host integration test."
