name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAP_AI_BUILD_TESTS=ON -DSNAP_FRAME_BUILD_TESTS=ON -DSNAP_FRAME_BUILD_EXAMPLE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Compile and validate SnapFrame shaders
        run: python3 framegen/tools/compile_snapframe_shaders.py --output "$RUNNER_TEMP/snapframe_shaders.h"
