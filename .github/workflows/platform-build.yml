name: Platform builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSNAP_AI_BUILD_TESTS=ON -DSNAP_FRAME_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure Android arm64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DSNAP_AI_BUILD_TESTS=OFF -DSNAP_AI_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_TESTS=OFF -DSNAP_FRAME_BUILD_EXAMPLE=OFF
      - name: Build Android libraries
        run: cmake --build build-android --parallel
      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: snapframe-android-arm64
          path: build-android/**/*.so
          if-no-files-found: error
          retention-days: 7
